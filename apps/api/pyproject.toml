[project]
name = "mandate-backend"
version = "0.1.0"
description = "MANDATE shopping agent policy engine backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "sqlalchemy[asyncio]>=2.0.23",
    "alembic>=1.12.1",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "httpx>=0.25.1",
    "anthropic>=0.18.1",
    "openai>=1.0.0",
    "scikit-learn>=1.3.2",
    "torch>=2.1.1",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "pandas>=2.1.3",
    "numpy>=1.26.2",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "pyotp>=2.9.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "hypothesis>=6.91.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1"
]

[tool.ruff]
line-length = 500
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = [
    "tests",
    "alembic"
]
