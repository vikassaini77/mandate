name: MANDATE CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-security-and-tests:
    name: Backend Tests & Red-Team Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Code Quality & Linting
        run: |
          uv run --project apps/api ruff check apps/api/src/ packages/ tests/ scripts/

      - name: Run Deterministic Policy Invariant Suite
        run: |
          uv run --project apps/api --extra dev pytest tests/unit/ -v

      - name: Run 32-Scenario Adversarial Red-Team Lab
        run: |
          uv run --project apps/api python scripts/redteam/run_redteam.py

      - name: Upload Red-Team Benchmark Report
        uses: actions/upload-artifact@v4
        with:
          name: redteam-benchmark-report
          path: docs/redteam_report.md
          retention-days: 14

  frontend-build:
    name: Frontend Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web && npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          cd apps/web && npm run build
